<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" style="width:100%;height:100%">
  <defs>
    <linearGradient id="opti-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"></stop>
      <stop offset="50%" stop-color="#8B5CF6"></stop>
      <stop offset="100%" stop-color="#D946EF"></stop>
    </linearGradient>
    <linearGradient id="opti-grad-2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"></stop>
      <stop offset="100%" stop-color="#3B82F6"></stop>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#8B5CF6" flood-opacity="0.35"></feDropShadow>
    </filter>

    <style>
      /* Center transform origins at (256, 256) */
      .anim-arc-top,
      .anim-arc-bottom,
      .anim-bar,
      .anim-core {
        transform-origin: 256px 256px;
      }

      /* 1. Top Arc slides in from the RIGHT (+200px offset + rotation) */
      .anim-arc-top {
        animation: arcFromRight 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      /* 2. Bottom Arc slides in from the LEFT (-200px offset + opposite rotation) */
      .anim-arc-bottom {
        animation: arcFromLeft 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      /* 3. Diagonal Bar sweeps in smoothly slightly behind */
      .anim-bar {
        animation: barFadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both;
      }

      /* 4. Center White Core pops in last with an elastic bounce */
      .anim-core {
        animation: corePop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.8s both;
      }

      /* Subtle floating idle state after assembly */
      .anim-group {
        animation: floatIdle 4s ease-in-out infinite alternate 2s;
        transform-origin: 256px 256px;
      }

      /* --- Animation Keyframes --- */
      @keyframes arcFromRight {
        0% {
          opacity: 0;
          transform: translate(220px, -60px) rotate(45deg) scale(0.7);
        }
        100% {
          opacity: 1;
          transform: translate(0, 0) rotate(0deg) scale(1);
        }
      }

      @keyframes arcFromLeft {
        0% {
          opacity: 0;
          transform: translate(-220px, 60px) rotate(-45deg) scale(0.7);
        }
        100% {
          opacity: 1;
          transform: translate(0, 0) rotate(0deg) scale(1);
        }
      }

      @keyframes barFadeIn {
        0% {
          opacity: 0;
          transform: scale(0.4) rotate(-30deg);
        }
        100% {
          opacity: 0.9;
          transform: scale(1) rotate(0deg);
        }
      }

      @keyframes corePop {
        0% {
          opacity: 0;
          transform: scale(0);
        }
        100% {
          opacity: 0.95;
          transform: scale(1);
        }
      }

      @keyframes floatIdle {
        0% {
          transform: translateY(0px);
        }
        100% {
          transform: translateY(-8px);
        }
      }
    </style>
  </defs>

  <g class="anim-group" filter="url(#glow)">
    <!-- Top Arc (Enters from Right) -->
    <path class="anim-arc-top" d="M 256 64 C 362 64, 448 150, 448 256 C 448 290, 439 322, 423 350 L 340 267 C 352 240, 345 208, 321 184 C 297 160, 265 153, 238 165 L 155 82 C 185 70, 220 64, 256 64 Z" fill="url(#opti-grad-1)"></path>
    
    <!-- Bottom Arc (Enters from Left) -->
    <path class="anim-arc-bottom" d="M 256 448 C 150 448, 64 362, 64 256 C 64 222, 73 190, 89 162 L 172 245 C 160 272, 167 304, 191 328 C 215 352, 247 359, 274 347 L 357 430 C 327 442, 292 448, 256 448 Z" fill="url(#opti-grad-1)"></path>
    
    <!-- Diagonal Bar -->
    <polygon class="anim-bar" points="110,410 410,110 380,80 80,380" fill="url(#opti-grad-2)"></polygon>
  </g>

  <!-- Central Core -->
  <circle class="anim-core" cx="256" cy="256" r="28" fill="#FFFFFF"></circle>
</svg>
