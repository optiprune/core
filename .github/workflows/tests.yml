name: Testing

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  find-matrix:
    runs-on: ubuntu-latest
    outputs:
      folders: ${{ steps.set-matrix.outputs.folders }}
    steps:
      - uses: actions/checkout@v4

      - name: Scan test directories
        id: set-matrix
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          const testsDir = path.join(process.cwd(), "tests");

          function containsTestTs(dir) {
            try {
              const entries = fs.readdirSync(dir, { withFileTypes: true });
              for (const entry of entries) {
                if (entry.name.startsWith(".") || entry.name === "node_modules") continue;

                const fullPath = path.join(dir, entry.name);
                
                if (entry.isDirectory()) {
                  if (containsTestTs(fullPath)) return true;
                } else if (entry.isFile() && /\.test\.ts$/.test(entry.name)) {
                  return true;
                }
              }
            } catch (err) {
              // Ignore unreadable directories
            }
            return false;
          }

          let folders = [];
          if (fs.existsSync(testsDir)) {
            folders = fs.readdirSync(testsDir, { withFileTypes: true })
              .filter(d => d.isDirectory() && !d.name.startsWith(".") && d.name !== "node_modules")
              .filter(d => containsTestTs(path.join(testsDir, d.name)))
              .map(d => d.name);
          }

          console.log("Discovered folders with active .test.ts files:", folders);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `folders=${JSON.stringify(folders)}\n`);
          '

  test:
    needs: find-matrix
    if: needs.find-matrix.outputs.folders != '[]' && needs.find-matrix.outputs.folders != ''
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node-version:
          - 21
          - 22
          - 24
        folder: ${{ fromJSON(needs.find-matrix.outputs.folders) }}

    name: Test ${{ matrix.folder }} (${{ matrix.os }}, Node ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Build Language Server (if required)
        if: matrix.folder == 'Language-Server' || matrix.folder == 'language-server'
        run: npm run build

      - name: Run Tests with Retry
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 2
          command: npm run test ${{ matrix.folder }}/