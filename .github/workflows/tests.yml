name: Test

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20, 22]
    name: Validate (${{ matrix.os }}, Node ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run format:check
      - run: npm run build --workspace @optiprune/docs
      - run: npm run check --workspace @optiprune/docs
