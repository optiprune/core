name: Test on push

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20, 22]
    name: Validate (${{ matrix.os }}, Node ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run build

      # Vitest will filter tests matching the core directory path
      - name: Run Core Tests
        run: npm run test -- core

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: optiprune/core
          flags: core,${{ matrix.os }}-node-${{ matrix.node-version }}
          name: codecov-${{ matrix.os }}-node-${{ matrix.node-version }}-core
          fail_ci_if_error: false
        continue-on-error: true

      - name: Run Language Server Tests
        run: npm run test --workspace @optiprune/language-server
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: optiprune/core
          flags: lsp,${{ matrix.os }}-node-${{ matrix.node-version }}
          name: codecov-${{ matrix.os }}-node-${{ matrix.node-version }}-language-server
          fail_ci_if_error: false
        continue-on-error: true
