name: Linting

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  Format-OptiPrune:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
      - run: npm ci
      - run: npm run format:check
