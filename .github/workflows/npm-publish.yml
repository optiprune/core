name: Publish packages

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"

      - name: Install locked dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Publish @optiprune/core
        run: npm publish --workspace @optiprune/core --access public --provenance

      - name: Publish @optiprune/language-server
        run: npm publish --workspace @optiprune/language-server --access public --provenance
