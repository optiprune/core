name: Publish packages

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"

      - name: Install locked dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Publish @optiprune/core
        run: |
          VERSION=$(node -p "require('./core/package.json').version")
          TAG=$(node -e "const m = '$VERSION'.match(/-([a-zA-Z]+)/); console.log(m ? m[1] : 'latest')")
          npm publish --workspace @optiprune/core --access public --provenance --tag "$TAG"

      - name: Publish @optiprune/language-server
        run: |
          VERSION=$(node -p "require('./language-server/package.json').version")
          TAG=$(node -e "const m = '$VERSION'.match(/-([a-zA-Z]+)/); console.log(m ? m[1] : 'latest')")
          npm publish --workspace @optiprune/language-server --access public --provenance --tag "$TAG"
