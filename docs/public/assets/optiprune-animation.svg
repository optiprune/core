<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" style="width:100%;height:100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="opti-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"></stop>
      <stop offset="50%" stop-color="#8B5CF6"></stop>
      <stop offset="100%" stop-color="#D946EF"></stop>
    </linearGradient>
    <linearGradient id="opti-grad-2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"></stop>
      <stop offset="100%" stop-color="#3B82F6"></stop>
    </linearGradient>

    <!-- Original Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#8B5CF6" flood-opacity="0.35"></feDropShadow>
    </filter>

    <style>
      .anim-arcs-container,
      .anim-bar,
      .anim-core {
        transform-origin: 256px 256px;
      }

      /* 1. Bar slides through the open gap and locks into position */
      .anim-bar {
        animation: barSlideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
        opacity: 0;
      }

      /* 2. Arcs wait open at 90deg, then snap closed around the static bar */
      .anim-arcs-container {
        animation: arcsLockAroundBar 1.4s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
      }

      /* 3. Original r=28 center dot pops in */
      .anim-core {
        animation: dotPopIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) 1.15s forwards;
        opacity: 0;
      }

      /* Keyframes */
      @keyframes barSlideIn {
        0% {
          opacity: 0;
          transform: translate(360px, -360px);
        }
        30% {
          opacity: 0.9;
        }
        85% {
          transform: translate(-5px, 5px);
        }
        100% {
          opacity: 0.9;
          transform: translate(0, 0);
        }
      }

      @keyframes arcsLockAroundBar {
        0% {
          opacity: 0;
          transform: rotate(90deg);
        }
        15% {
          opacity: 1;
          transform: rotate(90deg);
        }
        /* Holds gap open while the bar enters */
        42% {
          transform: rotate(90deg);
        }
        /* Snaps shut to original 0deg with a clean lock */
        82% {
          transform: rotate(-3deg);
        }
        100% {
          opacity: 1;
          transform: rotate(0deg);
        }
      }

      @keyframes dotPopIn {
        0% {
          opacity: 0;
          transform: scale(0);
        }
        70% {
          opacity: 0.95;
          transform: scale(1.15);
        }
        100% {
          opacity: 0.95;
          transform: scale(1);
        }
      }
    </style>
  </defs>

  <g filter="url(#glow)">
    <!-- Arcs group -->
    <g class="anim-arcs-container">
      <path d="M 256 64 C 362 64, 448 150, 448 256 C 448 290, 439 322, 423 350 L 340 267 C 352 240, 345 208, 321 184 C 297 160, 265 153, 238 165 L 155 82 C 185 70, 220 64, 256 64 Z" fill="url(#opti-grad-1)"></path>
      <path d="M 256 448 C 150 448, 64 362, 64 256 C 64 222, 73 190, 89 162 L 172 245 C 160 272, 167 304, 191 328 C 215 352, 247 359, 274 347 L 357 430 C 327 442, 292 448, 256 448 Z" fill="url(#opti-grad-1)"></path>
    </g>

    <!-- Diagonal Bar -->
    <polygon class="anim-bar" points="110,410 410,110 380,80 80,380" fill="url(#opti-grad-2)" opacity="0.9"></polygon>
  </g>

  <!-- Center Dot -->
  <circle class="anim-core" cx="256" cy="256" r="28" fill="#FFFFFF" opacity="0.95"></circle>
</svg>
